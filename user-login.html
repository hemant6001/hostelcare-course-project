<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HostelCare | User Login</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-icon">
                👨‍🎓
            </div>

            <h1>HostelCare</h1>

            <h2>Student Login</h2>

            <p class="login-subtitle">
                Login to access your hostel maintenance portal
            </p>


            <form id="userLoginForm">

                <div class="form-group">

                    <label for="userEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="userEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="userPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="userPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit">
                    Login
                </button>

            </form>


            <p class="demo-login">
                Demo: neha@gmail.com / 123456
            </p>


            <a href="index.html" class="back-link">
                ← Back to Home
            </a>

        </div>

    </div>


    <script src="js/hostelcare-students.js"></script>
    <script src="js/hostelcare-auth.js"></script>
    <script src="js/user-login.js"></script>

</body>

</html>
