```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HostelCare | Student Registration</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <div class="login-icon">🎓</div>

            <h1>HostelCare</h1>
            <h2>Create Student Account</h2>

            <p class="login-subtitle">
                Register to manage and track your hostel complaints.
            </p>

            <form id="registrationForm">

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="registerEmail">Email Address</label>
                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input
                        type="tel"
                        id="mobile"
                        placeholder="Enter 10-digit mobile number"
                        pattern="[0-9]{10}"
                        maxlength="10"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="roomNumber">Hostel Room Number</label>
                    <input
                        type="text"
                        id="roomNumber"
                        placeholder="Example: A-204"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your password"
                        minlength="6"
                        required
                    >
                </div>

                <button type="submit">Create Account</button>

            </form>

            <p class="demo-login">
                Already registered?
                <a href="user-login.html">Login here</a>
            </p>

            <a href="index.html" class="back-link">
                ← Back to Home
            </a>

        </div>

    </div>

    <script src="js/hostelcare-students.js"></script>
    <script src="js/hostelcare-auth.js"></script>
    <script src="js/user-register.js"></script>
</body>
</html>
